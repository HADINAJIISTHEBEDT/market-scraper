<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart</title>
  <link rel="stylesheet" href="css.css" />
  <style>
    body { max-width: 700px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 20px; }
    .cart-item {
      display: grid;
      grid-template-columns: 60px minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: 12px;
      border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 12px; margin-bottom: 10px; background: #fff;
    }
    html[dir="rtl"] .cart-item {
      grid-template-columns: auto auto auto minmax(0, 1fr) 60px;
    }
    .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
    html[dir="rtl"] .cart-item img { order: 5; }
    .cart-item-info { min-width: 0; }
    .cart-item-name { font-weight: 600; font-size: 15px; line-height: 1.35; }
    .cart-item-market { display: none; }
    .cart-item-price { color: #065f46; font-weight: 600; white-space: nowrap; }
    .qty-controls {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      direction: ltr;
      unicode-bidi: isolate;
      flex-shrink: 0;
    }
    .qty-btn {
      width: 32px; height: 32px; border: 1px solid #cbd5e1;
      border-radius: 8px; background: #f8fafc; cursor: pointer;
      font-size: 18px; line-height: 1; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .qty-num { font-weight: 700; min-width: 28px; text-align: center; }
    .remove-btn {
      background: none; border: none; color: #b91c1c;
      cursor: pointer; font-size: 20px; padding: 4px;
    }
    .cart-summary {
      border-top: 2px solid #e5e7eb; margin-top: 20px;
      padding-top: 16px; text-align: right;
    }
    .payment-box {
      margin-top: 18px; padding: 16px; border: 1px solid #e5e7eb;
      border-radius: 12px; background: #fff; text-align: left;
    }
    .payment-box h2 { margin: 0 0 12px; font-size: 17px; font-weight: 700; color: #1e293b; }
    .pay-method-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
    }
    .pay-method-option {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; padding: 14px 10px; border: 2px solid #e2e8f0; border-radius: 12px;
      background: #f8fafc; cursor: pointer; transition: border-color .15s, background .15s;
      font-weight: 600; font-size: 14px; color: #334155; text-align: center;
    }
    .pay-method-option input { position: absolute; opacity: 0; pointer-events: none; }
    .pay-method-option.selected { border-color: #16a34a; background: #f0fdf4; color: #166534; }
    .pay-method-icon { font-size: 22px; line-height: 1; }
    .pay-card-fields { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #e5e7eb; }
    .pay-card-fields.visible { display: grid; gap: 8px; }
    .pay-field {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px;
      font: inherit; box-sizing: border-box;
    }
    .pay-hint { font-size: 13px; color: #64748b; margin: 0 0 10px; line-height: 1.4; }
    .cart-total { font-size: 22px; font-weight: 700; color: #1e293b; }
    .btn-order {
      margin-top: 14px; padding: 14px 32px;
      background: #16a34a; color: #fff; border: none;
      border-radius: 10px; font-size: 17px; cursor: pointer; width: 100%;
    }
    .btn-order:hover { background: #15803d; }
    .empty-msg { text-align: center; color: #64748b; margin-top: 60px; font-size: 18px; }
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
    }
    .nav-bar a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .lang-select {
      padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff;
    }
    #orderMsg { text-align: center; margin-top: 16px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a id="backLink" href="index.html">Back to Search</a>
    <span id="userGreet" style="color:#334155;font-size:14px;"></span>
    <a id="ordersLink" href="orders.html">My Orders</a>
    <select id="langSelect" class="lang-select">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>
  </div>

  <h1 id="pageTitle">My Cart</h1>
  <div id="cartList"></div>
  <div id="orderMsg"></div>

  <script src="feature-access.js"></script>
  <script src="app-settings.js"></script>
  <script src="firebase-config.global.js"></script>
  <script src="markets-config.global.js"></script>
  <script src="order-lifecycle.global.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="cart.core.js"></script>
</body>
</html>
