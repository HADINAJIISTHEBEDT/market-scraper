<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver</title>
  <link rel="stylesheet" href="css.css" />
  <style>
    body { max-width: 800px; margin: 0 auto; padding: 24px; background: #f8fafc; }
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap;
    }
    .nav-bar a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .lang-select, .field-input, .status-select {
      padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; background: #fff;
    }
    .card {
      border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #fff;
    }
    .card-title { font-weight: 800; color: #1e293b; }
    .card-meta { font-size: 13px; color: #64748b; margin-top: 4px; }
    .btn-primary, .btn-secondary, .btn-danger {
      padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 700;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .location-box {
      margin-top: 12px; padding: 12px; border-radius: 10px; background: #f8fafc; font-size: 14px;
    }
    .empty-msg { color: #64748b; text-align: center; padding: 24px 0; }
    .live-badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px; background: #dcfce7; color: #166534;
      font-size: 12px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a id="marketsLink" href="markets.html">Markets</a>
    <a id="marketLink" href="market.html">Market panel</a>
    <select id="langSelect" class="lang-select">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>
  </div>

  <h1 id="pageTitle">Driver tracking</h1>
  <p id="pageHelp" class="card-meta">Share live GPS for active deliveries and update order status.</p>

  <div id="activeOrderCard" class="card" hidden>
    <div class="card-title" id="activeOrderTitle">Active order</div>
    <div class="card-meta" id="activeOrderMeta"></div>
    <div class="location-box" id="locationBox"></div>
    <div class="actions-row">
      <button class="btn-primary" type="button" id="startTrackingBtn">Start live tracking</button>
      <button class="btn-danger" type="button" id="stopTrackingBtn" hidden>Stop tracking</button>
      <button class="btn-secondary" type="button" id="markDeliveredBtn">Mark delivered</button>
    </div>
  </div>

  <h2 id="ordersTitle" style="font-size:20px;margin:24px 0 12px;">Active deliveries</h2>
  <div id="ordersList"></div>

  <script src="feature-access.js"></script>
  <script src="app-settings.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, collection, doc, updateDoc, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import firebaseConfig from "./firebase-config.js";
    import { getMarketLabel } from "./markets-config.js";

    await window.AppSettings.ready();
    if (!window.FeatureAccess?.guardPage()) {
    } else {

    const I18N = {
      tr: {
        pageTitle: "Surucu takibi",
        pageHelp: "Aktif teslimatlar icin canli GPS paylasin ve siparis durumunu guncelleyin.",
        marketsLink: "Marketler",
        marketLink: "Market paneli",
        ordersTitle: "Aktif teslimatlar",
        noOrders: "Yolda siparis yok.",
        selectOrder: "Takip icin sec",
        activeOrder: "Aktif siparis",
        customer: "Musteri",
        market: "Market",
        startTracking: "Canli takibi baslat",
        stopTracking: "Takibi durdur",
        markDelivered: "Teslim edildi isaretle",
        trackingLive: "Canli konum paylasiliyor",
        trackingStopped: "Takip durduruldu",
        lastUpdate: "Son guncelleme",
        openMap: "Haritada ac",
        locationUnavailable: "Konum alinamadi",
        updated: "Guncellendi",
        unknown: "Bilinmiyor",
      },
      en: {
        pageTitle: "Driver tracking",
        pageHelp: "Share live GPS for active deliveries and update order status.",
        marketsLink: "Markets",
        marketLink: "Market panel",
        ordersTitle: "Active deliveries",
        noOrders: "No orders on the way.",
        selectOrder: "Select to track",
        activeOrder: "Active order",
        customer: "Customer",
        market: "Market",
        startTracking: "Start live tracking",
        stopTracking: "Stop tracking",
        markDelivered: "Mark delivered",
        trackingLive: "Sharing live location",
        trackingStopped: "Tracking stopped",
        lastUpdate: "Last update",
        openMap: "Open map",
        locationUnavailable: "Location unavailable",
        updated: "Updated",
        unknown: "Unknown",
      },
      ar: {
        pageTitle: "تتبع السائق",
        pageHelp: "شارك GPS المباشر للتسليمات النشطة وحدّث حالة الطلب.",
        marketsLink: "الأسواق",
        marketLink: "لوحة السوق",
        ordersTitle: "التسليمات النشطة",
        noOrders: "لا توجد طلبات في الطريق.",
        selectOrder: "اختر للتتبع",
        activeOrder: "الطلب النشط",
        customer: "العميل",
        market: "السوق",
        startTracking: "بدء التتبع المباشر",
        stopTracking: "إيقاف التتبع",
        markDelivered: "تعيين تم التسليم",
        trackingLive: "يتم مشاركة الموقع المباشر",
        trackingStopped: "تم إيقاف التتبع",
        lastUpdate: "آخر تحديث",
        openMap: "فتح الخريطة",
        locationUnavailable: "الموقع غير متاح",
        updated: "تم التحديث",
        unknown: "غير معروف",
      },
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentLang = localStorage.getItem("app_lang") || "tr";
    let currentOrders = [];
    let activeOrderId = "";
    let geoWatchId = null;

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N.tr[key] || key;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleDateString("tr-TR") + " " + d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    }

    function applyLanguage() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
      document.getElementById("langSelect").value = currentLang;
      document.getElementById("pageTitle").textContent = t("pageTitle");
      document.getElementById("pageHelp").textContent = t("pageHelp");
      document.getElementById("marketsLink").textContent = t("marketsLink");
      document.getElementById("marketLink").textContent = t("marketLink");
      document.getElementById("ordersTitle").textContent = t("ordersTitle");
      document.getElementById("activeOrderTitle").textContent = t("activeOrder");
      document.getElementById("startTrackingBtn").textContent = t("startTracking");
      document.getElementById("stopTrackingBtn").textContent = t("stopTracking");
      document.getElementById("markDeliveredBtn").textContent = t("markDelivered");
      document.title = t("pageTitle");
    }

    function renderLocationBox(order) {
      const box = document.getElementById("locationBox");
      const loc = order?.driverLocation;
      if (!loc || loc.lat == null || loc.lng == null) {
        box.textContent = t("locationUnavailable");
        return;
      }
      const mapUrl = `https://www.google.com/maps?q=${encodeURIComponent(loc.lat)},${encodeURIComponent(loc.lng)}`;
      box.innerHTML = `
        <span class="live-badge">${escapeHtml(t("trackingLive"))}</span><br>
        ${escapeHtml(t("lastUpdate"))}: ${escapeHtml(formatDate(loc.updatedAt))}<br>
        Lat: ${escapeHtml(String(loc.lat))}, Lng: ${escapeHtml(String(loc.lng))}<br>
        <a href="${mapUrl}" target="_blank" rel="noopener">${escapeHtml(t("openMap"))}</a>
      `;
    }

    function renderActiveOrder() {
      const card = document.getElementById("activeOrderCard");
      const order = currentOrders.find((entry) => entry.id === activeOrderId);
      if (!order) {
        card.hidden = true;
        return;
      }
      card.hidden = false;
      document.getElementById("activeOrderMeta").innerHTML = `
        ${escapeHtml(t("customer"))}: ${escapeHtml(order.userName || t("unknown"))}<br>
        ${escapeHtml(t("market"))}: ${escapeHtml(getMarketLabel(order.marketId || order.marketName))}
      `;
      renderLocationBox(order);
    }

    function renderOrders(orders) {
      const active = orders
        .filter((order) => order.status === "on-the-way" || order.status === "preparing")
        .sort((a, b) => String(b.updatedAt || b.createdAt || "").localeCompare(String(a.updatedAt || a.createdAt || "")));
      currentOrders = active;
      const root = document.getElementById("ordersList");

      if (!active.length) {
        root.innerHTML = `<p class="empty-msg">${escapeHtml(t("noOrders"))}</p>`;
        document.getElementById("activeOrderCard").hidden = true;
        return;
      }

      if (!activeOrderId || !active.some((order) => order.id === activeOrderId)) {
        activeOrderId = active[0].id;
      }

      root.innerHTML = active.map((order) => `
        <div class="card">
          <div class="card-title">${escapeHtml(order.userName || t("unknown"))}</div>
          <div class="card-meta">${escapeHtml(getMarketLabel(order.marketId || order.marketName))} · ${escapeHtml(formatDate(order.createdAt))}</div>
          <div class="actions-row">
            <button class="btn-primary" type="button" data-driver-action="select-order" data-order-id="${escapeHtml(order.id)}">
              ${escapeHtml(t("selectOrder"))}
            </button>
          </div>
        </div>
      `).join("");

      renderActiveOrder();
    }

    async function pushDriverLocation(position) {
      if (!activeOrderId) return;
      const now = new Date().toISOString();
      await updateDoc(doc(db, "orders", activeOrderId), {
        driverLocation: {
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracy: position.coords.accuracy,
          updatedAt: now,
        },
        updatedAt: now,
      });
      const order = currentOrders.find((entry) => entry.id === activeOrderId);
      if (order) {
        order.driverLocation = {
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracy: position.coords.accuracy,
          updatedAt: now,
        };
        renderLocationBox(order);
      }
    }

    function startTracking() {
      if (!activeOrderId || !navigator.geolocation) return;
      if (geoWatchId != null) navigator.geolocation.clearWatch(geoWatchId);
      geoWatchId = navigator.geolocation.watchPosition(
        (position) => { void pushDriverLocation(position); },
        (error) => {
          console.error("Geolocation failed", error);
          document.getElementById("locationBox").textContent = t("locationUnavailable");
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
      document.getElementById("startTrackingBtn").hidden = true;
      document.getElementById("stopTrackingBtn").hidden = false;
    }

    function stopTracking() {
      if (geoWatchId != null) {
        navigator.geolocation.clearWatch(geoWatchId);
        geoWatchId = null;
      }
      document.getElementById("startTrackingBtn").hidden = false;
      document.getElementById("stopTrackingBtn").hidden = true;
      document.getElementById("locationBox").textContent = t("trackingStopped");
    }

    async function markDelivered() {
      if (!activeOrderId) return;
      await updateDoc(doc(db, "orders", activeOrderId), {
        status: "delivered",
        deliveredAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      });
      stopTracking();
      activeOrderId = "";
      alert(t("updated"));
    }

    document.getElementById("startTrackingBtn").addEventListener("click", startTracking);
    document.getElementById("stopTrackingBtn").addEventListener("click", stopTracking);
    document.getElementById("markDeliveredBtn").addEventListener("click", () => { void markDelivered(); });

    document.body.addEventListener("click", (event) => {
      const button = event.target.closest("[data-driver-action]");
      if (!button) return;
      if (button.dataset.driverAction === "select-order") {
        activeOrderId = button.dataset.orderId || "";
        renderActiveOrder();
      }
    });

    document.getElementById("langSelect").addEventListener("change", (event) => {
      currentLang = String(event.target.value || "tr");
      localStorage.setItem("app_lang", currentLang);
      applyLanguage();
      renderOrders(currentOrders);
      renderActiveOrder();
    });

    applyLanguage();

    onSnapshot(collection(db, "orders"), (snapshot) => {
      const orders = snapshot.docs.map((entry) => ({ id: entry.id, ...entry.data() }));
      renderOrders(orders);
      if (activeOrderId) renderActiveOrder();
    });
    }
  </script>
</body>
</html>
