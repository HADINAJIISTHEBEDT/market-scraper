<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders</title>
  <link rel="stylesheet" href="css.css" />
  <style>
    body { max-width: 750px; margin: 0 auto; padding: 24px; }
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
    }
    .nav-bar a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .lang-select, .chat-input {
      padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font: inherit;
    }
    .order-card {
      border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 16px; margin-bottom: 16px; background: #fff;
    }
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
    .order-date { font-size: 13px; color: #64748b; }
    .order-total { font-weight: 700; color: #1e293b; font-size: 16px; }
    .status-badge {
      display: inline-block; padding: 4px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
    }
    .status-pending, .status-waiting { background: #fef9c3; color: #854d0e; }
    .status-awaiting-payment { background: #ffedd5; color: #9a3412; }
    .status-preparing { background: #dbeafe; color: #1e40af; }
    .status-on-the-way { background: #fce7f3; color: #9d174d; }
    .status-delivered, .status-arrived { background: #dcfce7; color: #166534; }
    .order-items { margin-top: 10px; }
    .item-category-block { margin-top: 10px; }
    .item-category-title {
      font-weight: 700; color: #334155; margin-bottom: 6px; padding-bottom: 4px;
      border-bottom: 1px solid #e2e8f0; font-size: 14px;
    }
    .order-item-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      font-size: 14px; padding: 6px 0; border-bottom: 1px solid #f1f5f9;
    }
    .item-unavailable { opacity: .55; text-decoration: line-through; }
    .avail-badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .avail-yes { background: #dcfce7; color: #166534; }
    .avail-no { background: #fee2e2; color: #991b1b; }
    .status-track { display: flex; gap: 0; margin-top: 14px; }
    .track-step {
      flex: 1; text-align: center; padding: 6px 4px; font-size: 12px;
      background: #f1f5f9; border: 1px solid #e2e8f0;
    }
    .track-step.done { background: #16a34a; color: #fff; border-color: #16a34a; }
    .track-step.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .driver-box {
      margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #f8fafc; font-size: 14px;
    }
    .chat-panel {
      margin-top: 12px; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden;
    }
    .chat-messages {
      max-height: 200px; overflow-y: auto; padding: 10px; background: #f8fafc; display: grid; gap: 8px;
    }
    .chat-msg {
      max-width: 85%; padding: 8px 10px; border-radius: 10px; font-size: 13px; line-height: 1.4;
    }
    .chat-msg.market { background: #dbeafe; color: #1e3a8a; justify-self: start; }
    .chat-msg.customer { background: #fff; border: 1px solid #e2e8f0; justify-self: end; }
    .chat-msg-meta { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .chat-compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e7eb; }
    .chat-input { flex: 1; }
    .btn-send {
      padding: 8px 14px; border: none; border-radius: 8px; background: #2563eb; color: #fff;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .empty-msg { text-align: center; color: #64748b; margin-top: 60px; font-size: 18px; }
    .status-closed { background: #e2e8f0; color: #475569; }
    .feedback-box {
      margin-top: 12px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; background: #f8fafc;
    }
    .feedback-title { font-weight: 700; margin-bottom: 8px; color: #334155; font-size: 14px; }
    .feedback-input {
      width: 100%; min-height: 72px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px;
      font: inherit; resize: vertical; box-sizing: border-box; margin-bottom: 8px;
    }
    .feedback-thanks { color: #166534; font-weight: 600; }
    .feedback-closed { color: #475569; font-weight: 600; }
    .call-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn-call, .btn-video {
      padding: 8px 14px; border: none; border-radius: 8px; font: inherit; font-weight: 700;
      cursor: pointer; text-decoration: none; display: inline-block;
    }
    .btn-call { background: #16a34a; color: #fff; }
    .btn-video { background: #7c3aed; color: #fff; }
    .btn-call:disabled, .btn-video:disabled { opacity: .45; cursor: not-allowed; }
    .chat-msg.driver { background: #fef3c7; color: #92400e; justify-self: start; }
    .chat-disabled { opacity: .65; }
    .chat-disabled .chat-compose { display: none; }
    .driver-phone { font-size: 14px; color: #334155; margin-top: 4px; }
    .live-map-panel {
      margin-top: 10px; position: relative; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0;
    }
    .live-map-frame { display: block; width: 100%; height: 220px; border: 0; }
    .live-badge {
      display: inline-block; margin-bottom: 8px; padding: 4px 10px; border-radius: 999px;
      background: #dcfce7; color: #166534; font-size: 12px; font-weight: 700;
    }
    .payment-panel {
      margin-top: 12px; padding: 14px; border: 1px solid #fcd34d; border-radius: 12px; background: #fffbeb;
    }
    .payment-panel h3 { margin: 0 0 8px; font-size: 16px; color: #92400e; }
    .payment-panel .pay-hint { font-size: 13px; color: #78350f; margin: 0 0 10px; line-height: 1.4; }
    .pay-method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .pay-method-option {
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px;
      border: 2px solid #fde68a; border-radius: 10px; background: #fff; cursor: pointer;
      font-weight: 600; font-size: 13px; color: #78350f; text-align: center;
    }
    .pay-method-option input { position: absolute; opacity: 0; pointer-events: none; }
    .pay-method-option.selected { border-color: #16a34a; background: #f0fdf4; color: #166534; }
    .pay-card-fields { display: none; gap: 8px; margin-bottom: 10px; }
    .pay-card-fields.visible { display: grid; }
    .pay-field {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px;
      font: inherit; box-sizing: border-box;
    }
    .btn-pay {
      width: 100%; padding: 12px; border: none; border-radius: 10px; background: #16a34a;
      color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    .btn-pay:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a id="searchLink" href="index.html">Search</a>
    <span id="userGreet" style="color:#334155;font-size:14px;"></span>
    <a id="cartLink" href="cart.html">Cart</a>
    <select id="langSelect" class="lang-select">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>
  </div>

  <h1 id="pageTitle">My Orders</h1>
  <div id="ordersList"></div>

  <script src="feature-access.js"></script>
  <script src="app-settings.js"></script>
  <script src="firebase-config.global.js"></script>
  <script src="markets-config.global.js"></script>
  <script src="order-lifecycle.global.js"></script>
  <script src="in-app-call.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="orders.core.js"></script>
</body>
</html>
