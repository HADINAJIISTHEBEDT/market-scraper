<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Sign In</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #edf2fb;
      color: #202124;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .actions { margin-top: 16px; display: grid; gap: 10px; }
    button, a.btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: #1F3FA0;
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <p id="status">Opening Google sign-in...</p>
    <div id="actions" class="actions" hidden></div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      browserLocalPersistence,
      getAuth,
      getRedirectResult,
      GoogleAuthProvider,
      onAuthStateChanged,
      setPersistence,
      signInWithPopup,
      signInWithRedirect,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import firebaseConfig from "./firebase-config.js";

    const AUTH_MESSAGE = "pazarquery-auth";
    const APP_HOME = "https://market-scraper-0k36.onrender.com/index.html";
    const APP_LOGIN = "https://market-scraper-0k36.onrender.com/login.html";
    const APP_PACKAGE = "com.marketfiyati.app";
    const statusEl = document.getElementById("status");
    const actionsEl = document.getElementById("actions");

    function isAndroidCustomTabReturn() {
      return new URLSearchParams(window.location.search).get("return") === "android";
    }

    function isEmbeddedAndroidApp() {
      try {
        if (window.AndroidApp && window.AndroidApp.isAndroidApp && window.AndroidApp.isAndroidApp()) {
          return true;
        }
      } catch (error) {
        console.warn("Android bridge unavailable", error);
      }
      return new URLSearchParams(window.location.search).get("from") === "app";
    }

    function isInAppAuthWebView() {
      const params = new URLSearchParams(window.location.search);
      return params.get("webview") === "1" || params.get("from") === "app";
    }

    function isRecoverableRedirectError(error) {
      const code = String(error?.code || "");
      const message = String(error?.message || "");
      return code === "auth/no-auth-event" ||
        message.includes("missing initial state") ||
        message.includes("sessionStorage is inaccessible");
    }

    function redirectSignInInProgress() {
      return sessionStorage.getItem("auth_bridge_redirect_started") === "1" ||
        localStorage.getItem("auth_bridge_redirect_started") === "1";
    }

    function markRedirectStarted() {
      sessionStorage.setItem("auth_bridge_redirect_started", "1");
      localStorage.setItem("auth_bridge_redirect_started", "1");
    }

    function clearRedirectStarted() {
      sessionStorage.removeItem("auth_bridge_redirect_started");
      localStorage.removeItem("auth_bridge_redirect_started");
    }

    function appIntentUrl(pageUrl) {
      const withoutScheme = pageUrl.replace(/^https:\/\//, "");
      return "intent://" + withoutScheme +
        "#Intent;scheme=https;package=" + APP_PACKAGE +
        ";S.browser_fallback_url=" + encodeURIComponent(pageUrl) + ";end";
    }

    function buildAndroidReturnUrl(user) {
      const params = new URLSearchParams();
      params.set("auth_uid", user.uid);
      params.set("auth_email", user.email || "");
      params.set("auth_name", user.displayName || "");
      if (user.photoURL) {
        params.set("auth_photo", user.photoURL);
      }
      return APP_LOGIN + "?" + params.toString();
    }

    function showOpenAppActions(pageUrl, label) {
      actionsEl.hidden = false;
      actionsEl.innerHTML =
        '<a class="btn" href="' + appIntentUrl(pageUrl) + '">' + label + "</a>" +
        '<button type="button" id="closeWindowBtn">Close this tab</button>';
      document.getElementById("closeWindowBtn").addEventListener("click", () => window.close());
    }

    function notify(payload) {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: AUTH_MESSAGE, ...payload }, "*");
      }
    }

    function returnToAndroidApp(returnUrl) {
      clearRedirectStarted();
      try {
        if (window.AndroidApp && window.AndroidApp.completeAuthReturn) {
          window.AndroidApp.completeAuthReturn(returnUrl);
          return;
        }
      } catch (error) {
        console.warn("Android completeAuthReturn failed", error);
      }
      window.location.replace(returnUrl);
    }

    function finish(message, isError, pageAfterSuccess) {
      statusEl.textContent = message;
      if (isError) {
        notify({ error: message });
        if (isEmbeddedAndroidApp()) {
          window.location.replace("login.html");
          return;
        }
        if (!window.opener) {
          showOpenAppActions(APP_LOGIN, "Open Pazar Fiyati app");
        } else {
          setTimeout(() => window.close(), 2500);
        }
        return;
      }
      if (isEmbeddedAndroidApp()) {
        window.location.replace("login.html");
        return;
      }
      if (window.opener && !window.opener.closed) {
        window.close();
        return;
      }
      showOpenAppActions(pageAfterSuccess || APP_HOME, "Open Pazar Fiyati app");
    }

    function finishSignedInUser(user) {
      if (!user?.email) {
        finish("No email returned from Google.", true);
        return;
      }
      clearRedirectStarted();
      const returnMode = new URLSearchParams(window.location.search).get("return");
      if (returnMode === "android" || isInAppAuthWebView() || isEmbeddedAndroidApp()) {
        statusEl.textContent = "Signed in. Returning to the app...";
        returnToAndroidApp(buildAndroidReturnUrl(user));
        return;
      }
      if (window.opener && !window.opener.closed) {
        notify({
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || "",
          photoURL: user.photoURL || "",
        });
      }
      finish("Signed in. Returning to the app...", false, APP_HOME);
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    async function clearCachedAuthSession() {
      try {
        if (auth.currentUser) {
          await signOut(auth);
        }
      } catch (error) {
        console.warn("Auth bridge sign-out failed", error);
      }
    }

    async function completePendingRedirect() {
      try {
        const result = await getRedirectResult(auth);
        if (result?.user) {
          finishSignedInUser(result.user);
          return true;
        }
      } catch (error) {
        if (!isRecoverableRedirectError(error)) {
          console.error("Auth bridge redirect result failed", error);
          finish(error.message || "Google sign-in failed.", true);
          return true;
        }
        console.warn("Redirect result unavailable", error);
      }

      if (redirectSignInInProgress()) {
        if (auth.currentUser) {
          finishSignedInUser(auth.currentUser);
          return true;
        }
        statusEl.textContent = "Completing sign-in...";
        return await new Promise((resolve) => {
          const timeout = setTimeout(() => {
            clearRedirectStarted();
            finish("Sign-in timed out. Close and try again.", true);
            resolve(true);
          }, 20000);
          const unsub = onAuthStateChanged(auth, (user) => {
            if (!user) return;
            clearTimeout(timeout);
            unsub();
            finishSignedInUser(user);
            resolve(true);
          });
        });
      }

      return false;
    }

    async function startFreshAndroidSignIn() {
      await clearCachedAuthSession();
      try {
        const result = await signInWithPopup(auth, provider);
        finishSignedInUser(result.user);
      } catch (error) {
        const code = String(error?.code || "");
        if (code === "auth/popup-blocked" || code === "auth/cancelled-popup-request") {
          markRedirectStarted();
          try {
            await signInWithRedirect(auth, provider);
          } catch (redirectError) {
            clearRedirectStarted();
            console.error("Auth bridge redirect failed", redirectError);
            finish(redirectError.message || "Google sign-in failed.", true);
          }
          return;
        }
        console.error("Auth bridge popup failed", error);
        finish(error.message || "Google sign-in failed.", true);
      }
    }

    async function startPopupSignIn() {
      try {
        const result = await signInWithPopup(auth, provider);
        finishSignedInUser(result.user);
      } catch (error) {
        console.error("Auth bridge popup failed", error);
        finish(error.message || "Google sign-in failed.", true);
      }
    }

    async function boot() {
      await setPersistence(auth, browserLocalPersistence);

      const completed = await completePendingRedirect();
      if (completed) return;

      if (isInAppAuthWebView() || isEmbeddedAndroidApp() || isAndroidCustomTabReturn()) {
        await startFreshAndroidSignIn();
        return;
      }

      await startPopupSignIn();
    }

    void boot();
  </script>
</body>
</html>
