<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Sign In</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #edf2fb;
      color: #202124;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .actions { margin-top: 16px; display: grid; gap: 10px; }
    button, a.btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: #1F3FA0;
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <p id="status">Opening Google sign-in...</p>
    <div id="actions" class="actions" hidden></div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      browserLocalPersistence,
      getAuth,
      getRedirectResult,
      GoogleAuthProvider,
      onAuthStateChanged,
      setPersistence,
      signInWithPopup,
      signInWithRedirect,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import firebaseConfig from "./firebase-config.js";

    const AUTH_MESSAGE = "pazarquery-auth";
    const APP_HOME = "https://market-scraper-0k36.onrender.com/index.html";
    const APP_LOGIN = "https://market-scraper-0k36.onrender.com/login.html";
    const APP_PACKAGE = "com.marketfiyati.app";
    const statusEl = document.getElementById("status");
    const actionsEl = document.getElementById("actions");

    function isAndroidCustomTabReturn() {
      return new URLSearchParams(window.location.search).get("return") === "android";
    }

    function isEmbeddedAndroidApp() {
      try {
        if (window.AndroidApp && window.AndroidApp.isAndroidApp && window.AndroidApp.isAndroidApp()) {
          return true;
        }
      } catch (error) {
        console.warn("Android bridge unavailable", error);
      }
      return new URLSearchParams(window.location.search).get("from") === "app";
    }

    function isRecoverableRedirectError(error) {
      const code = String(error?.code || "");
      const message = String(error?.message || "");
      return code === "auth/no-auth-event" ||
        message.includes("missing initial state") ||
        message.includes("sessionStorage is inaccessible");
    }

    function appIntentUrl(pageUrl) {
      const withoutScheme = pageUrl.replace(/^https:\/\//, "");
      return "intent://" + withoutScheme +
        "#Intent;scheme=https;package=" + APP_PACKAGE +
        ";S.browser_fallback_url=" + encodeURIComponent(pageUrl) + ";end";
    }

    function buildAndroidReturnUrl(user) {
      const params = new URLSearchParams();
      params.set("auth_uid", user.uid);
      params.set("auth_email", user.email || "");
      params.set("auth_name", user.displayName || "");
      if (user.photoURL) {
        params.set("auth_photo", user.photoURL);
      }
      return APP_LOGIN + "?" + params.toString();
    }

    function showOpenAppActions(pageUrl, label) {
      actionsEl.hidden = false;
      actionsEl.innerHTML =
        '<a class="btn" href="' + appIntentUrl(pageUrl) + '">' + label + "</a>" +
        '<button type="button" id="closeWindowBtn">Close this tab</button>';
      document.getElementById("closeWindowBtn").addEventListener("click", () => window.close());
    }

    function notify(payload) {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: AUTH_MESSAGE, ...payload }, "*");
      }
    }

    function finish(message, isError, pageAfterSuccess) {
      statusEl.textContent = message;
      if (isError) {
        notify({ error: message });
        if (isEmbeddedAndroidApp()) {
          window.location.replace("login.html");
          return;
        }
        if (!window.opener) {
          showOpenAppActions(APP_LOGIN, "Open Pazar Fiyati app");
        } else {
          setTimeout(() => window.close(), 2500);
        }
        return;
      }
      if (isEmbeddedAndroidApp()) {
        window.location.replace("login.html");
        return;
      }
      if (window.opener && !window.opener.closed) {
        window.close();
        return;
      }
      showOpenAppActions(pageAfterSuccess || APP_HOME, "Open Pazar Fiyati app");
    }

    function finishSignedInUser(user) {
      if (!user?.email) {
        finish("No email returned from Google.", true);
        return;
      }
      const returnMode = new URLSearchParams(window.location.search).get("return");
      if (returnMode === "android") {
        statusEl.textContent = "Signed in. Returning to the app...";
        const returnUrl = buildAndroidReturnUrl(user);
        const homeUrl = APP_HOME + "?" + new URL(returnUrl).searchParams.toString();
        sessionStorage.removeItem("auth_bridge_redirect_started");
        showOpenAppActions(homeUrl, "Open Pazar Fiyati app");
        window.location.href = appIntentUrl(homeUrl);
        return;
      }
      if (window.opener && !window.opener.closed) {
        notify({
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || "",
          photoURL: user.photoURL || "",
        });
      }
      finish("Signed in. Returning to the app...", false, APP_HOME);
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const loginHint = new URLSearchParams(window.location.search).get("login_hint") || "";
    if (loginHint) {
      provider.setCustomParameters({ login_hint: loginHint, prompt: "none" });
    } else {
      provider.setCustomParameters({ prompt: "select_account" });
    }

    async function startAndroidRedirectSignIn() {
      await setPersistence(auth, browserLocalPersistence);
      if (auth.currentUser) {
        finishSignedInUser(auth.currentUser);
        return;
      }
      try {
        const result = await getRedirectResult(auth);
        if (result?.user) {
          finishSignedInUser(result.user);
          return;
        }
      } catch (error) {
        if (!isRecoverableRedirectError(error)) {
          console.error("Auth bridge redirect result failed", error);
          finish(error.message || "Google sign-in failed.", true);
          return;
        }
        console.warn("Redirect result unavailable, starting fresh sign-in", error);
      }
      if (sessionStorage.getItem("auth_bridge_redirect_started") === "1") {
        statusEl.textContent = "Completing sign-in...";
        const timeout = setTimeout(() => {
          finish("Sign-in timed out. Tap Open Pazar Fiyati app below.", true);
        }, 20000);
        onAuthStateChanged(auth, (user) => {
          if (!user) return;
          clearTimeout(timeout);
          finishSignedInUser(user);
        });
        return;
      }
      sessionStorage.setItem("auth_bridge_redirect_started", "1");
      try {
        await signInWithRedirect(auth, provider);
      } catch (error) {
        console.error("Auth bridge redirect failed", error);
        finish(error.message || "Google sign-in failed.", true);
      }
    }

    async function startAndroidCustomTabSignIn() {
      await setPersistence(auth, browserLocalPersistence);
      if (auth.currentUser) {
        finishSignedInUser(auth.currentUser);
        return;
      }
      try {
        const result = await getRedirectResult(auth);
        if (result?.user) {
          finishSignedInUser(result.user);
          return;
        }
      } catch (error) {
        if (!isRecoverableRedirectError(error)) {
          console.error("Auth bridge redirect result failed", error);
          finish(error.message || "Google sign-in failed.", true);
          return;
        }
      }
      try {
        const result = await signInWithPopup(auth, provider);
        finishSignedInUser(result.user);
      } catch (error) {
        const code = String(error?.code || "");
        if (loginHint && (code === "auth/popup-closed-by-user" || code === "auth/user-cancelled" || code === "auth/account-exists-with-different-credential")) {
          provider.setCustomParameters({ login_hint: loginHint, prompt: "select_account" });
          try {
            const retry = await signInWithPopup(auth, provider);
            finishSignedInUser(retry.user);
            return;
          } catch (retryError) {
            console.error("Auth bridge popup retry failed", retryError);
          }
        }
        if (code === "auth/popup-blocked" || code === "auth/cancelled-popup-request") {
          await startAndroidRedirectSignIn();
          return;
        }
        console.error("Auth bridge popup failed", error);
        finish(error.message || "Google sign-in failed.", true);
      }
    }

    async function startPopupSignIn() {
      try {
        const result = await signInWithPopup(auth, provider);
        finishSignedInUser(result.user);
      } catch (error) {
        console.error("Auth bridge popup failed", error);
        finish(error.message || "Google sign-in failed.", true);
      }
    }

    if (isEmbeddedAndroidApp()) {
      startAndroidRedirectSignIn();
    } else if (isAndroidCustomTabReturn()) {
      startAndroidCustomTabSignIn();
    } else {
      startPopupSignIn();
    }
  </script>
</body>
</html>
