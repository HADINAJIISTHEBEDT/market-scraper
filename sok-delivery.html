<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sok Delivery</title>
  <link rel="stylesheet" href="css.css" />
  <link rel="stylesheet" href="market-panel.css" />
  <style>
    body { max-width: 800px; margin: 0 auto; padding: 24px; background: #f8fafc; }
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap;
    }
    .market-label { font-weight: 800; color: #f9b000; }
    .lang-select, .field-input, .status-select {
      padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; background: #fff;
    }
    .card {
      border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #fff;
    }
    .card-title { font-weight: 800; color: #1e293b; }
    .card-meta { font-size: 13px; color: #64748b; margin-top: 4px; }
    .btn-primary, .btn-secondary, .btn-danger {
      padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 700;
    }
    .btn-primary { background: #f9b000; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    .location-box, .payment-box, .items-box {
      margin-top: 12px; padding: 12px; border-radius: 10px; background: #f8fafc; font-size: 14px;
    }
    .empty-msg { color: #64748b; text-align: center; padding: 24px 0; }
    .live-badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px; background: #dcfce7; color: #166534;
      font-size: 12px; font-weight: 700;
    }
    .driver-gate-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .driver-gate-row .field-input { flex: 1; min-width: 180px; }
    .chat-panel { margin-top: 12px; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    .chat-messages { max-height: 180px; overflow-y: auto; padding: 10px; background: #f8fafc; display: grid; gap: 8px; }
    .chat-msg { max-width: 85%; padding: 8px 10px; border-radius: 10px; font-size: 13px; line-height: 1.4; }
    .chat-msg.customer { background: #dbeafe; color: #1e3a8a; justify-self: start; }
    .chat-msg.driver { background: #fef3c7; color: #92400e; justify-self: end; }
    .chat-msg-meta { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .chat-compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e7eb; }
    .chat-input { flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    .call-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn-call, .btn-video { padding: 8px 14px; border: none; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
    .btn-call { background: #16a34a; color: #fff; }
    .btn-video { background: #7c3aed; color: #fff; }
    .chat-disabled { opacity: .65; }
    .chat-disabled .chat-compose { display: none; }
  </style>
</head>
<body>
  <script>
    window.MARKET_ID = "sok";
    window.DELIVERY_MARKET_ID = "sok";
    window.MARKET_LABEL = "SOK";
  </script>

  <div class="nav-bar">
    <span class="market-label" id="marketLabel">sok Delivery</span>
    <button type="button" class="btn-secondary" id="driverLogoutBtn" hidden>Log out</button>
    <select id="langSelect" class="lang-select">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>
  </div>

  <div id="driverGate" class="card">
    <div class="card-title" id="driverGateTitle">Driver login</div>
    <p class="card-meta" id="driverGateHelp">Enter the name assigned to you in the market panel.</p>
    <div class="driver-gate-row">
      <input class="field-input" id="driverNameInput" type="text" autocomplete="name" placeholder="Driver name" />
      <input class="field-input" id="driverPhoneInput" type="tel" autocomplete="tel" placeholder="Phone (optional)" />
      <button class="btn-primary" type="button" id="driverPhoneSave">Continue</button>
    </div>
  </div>

  <div id="driverApp" hidden>
    <h1 id="pageTitle">sok delivery</h1>
    <p id="pageHelp" class="card-meta">Chat and call the customer in-app. Set arrived, then close the order.</p>

    <div id="activeOrderCard" class="card" hidden>
      <div class="card-title" id="activeOrderTitle">Active order</div>
      <div class="card-meta" id="activeOrderMeta"></div>
      <div class="payment-box" id="activeOrderPayment"></div>
      <div class="items-box" id="activeOrderItems"></div>
      <div class="actions-row">
        <select class="status-select" id="driverStatusSelect"></select>
        <button class="btn-primary" type="button" id="updateStatusBtn">Update status</button>
        <button class="btn-danger" type="button" id="closeOrderBtn" hidden>Close order</button>
      </div>
      <div class="location-box" id="locationBox"></div>
      <div class="actions-row">
        <button class="btn-primary" type="button" id="startTrackingBtn">Start live tracking</button>
        <button class="btn-secondary" type="button" id="stopTrackingBtn" hidden>Stop tracking</button>
      </div>
      <div id="driverCallRow" class="call-row" hidden></div>
      <div id="driverChatPanel" class="chat-panel" hidden>
        <div class="card-meta" style="padding:10px 10px 0;" id="driverChatTitle">Chat</div>
        <div class="chat-messages" id="driverChatMessages"></div>
        <div class="chat-compose">
          <input class="chat-input" id="driverChatInput" placeholder="" />
          <button class="btn-primary" type="button" id="driverChatSend">Send</button>
        </div>
      </div>
    </div>

    <h2 id="ordersTitle" style="font-size:20px;margin:24px 0 12px;">Your deliveries</h2>
    <div id="ordersList"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.global.js"></script>
  <script src="portal-access.global.js"></script>
  <script src="markets-config.global.js"></script>
  <script src="order-lifecycle.global.js"></script>
  <script src="in-app-call.js"></script>
  <script src="delivery.core.js"></script>
</body>
</html>
