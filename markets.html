<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markets</title>
  <link rel="stylesheet" href="css.css" />
  <style>
    body { max-width: 900px; margin: 0 auto; padding: 24px; background: #f8fafc; }
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap;
    }
    .nav-bar a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .lang-select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    h1 { margin: 0 0 8px; }
    .help { color: #64748b; margin: 0 0 20px; }
    .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .market-card {
      display: block; text-decoration: none; color: inherit; background: #fff;
      border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; transition: transform .15s, box-shadow .15s;
    }
    .market-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15, 23, 42, .08); }
    .market-badge {
      width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 14px; margin-bottom: 12px;
    }
    .market-name { font-size: 20px; font-weight: 800; color: #1e293b; }
    .market-link { margin-top: 8px; font-size: 13px; color: #2563eb; font-weight: 600; }
    .driver-link {
      display: inline-block; margin-top: 18px; padding: 10px 16px; border-radius: 10px;
      background: #2563eb; color: #fff; text-decoration: none; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a id="backLink" href="index.html">Back to App</a>
    <a id="adminLink" href="admin.html">Admin</a>
    <select id="langSelect" class="lang-select">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>
  </div>

  <h1 id="pageTitle">Market Panels</h1>
  <p class="help" id="pageHelp">Open a market panel to manage orders, item availability, driver tracking, and live chat.</p>
  <div class="market-grid" id="marketGrid"></div>
  <a class="driver-link" id="driverLink" href="driver.html">Driver tracking</a>

  <script src="feature-access.js"></script>
  <script src="app-settings.js"></script>
  <script type="module">
    import { MARKETS } from "./markets-config.js";

    await window.AppSettings.ready();
    if (!window.FeatureAccess?.guardPage()) {
    } else {

    const I18N = {
      tr: {
        pageTitle: "Market panelleri",
        pageHelp: "Siparisleri, urun uygunlugunu, surucu takibini ve canli sohbeti yonetmek icin bir market paneli acin.",
        backLink: "Uygulamaya don",
        adminLink: "Admin",
        openPanel: "Paneli ac",
        driverLink: "Surucu takibi",
      },
      en: {
        pageTitle: "Market panels",
        pageHelp: "Open a market panel to manage orders, item availability, driver tracking, and live chat.",
        backLink: "Back to App",
        adminLink: "Admin",
        openPanel: "Open panel",
        driverLink: "Driver tracking",
      },
      ar: {
        pageTitle: "لوحات الأسواق",
        pageHelp: "افتح لوحة سوق لإدارة الطلبات وتوفر المنتجات وتتبع السائق والدردشة المباشرة.",
        backLink: "العودة إلى التطبيق",
        adminLink: "الإدارة",
        openPanel: "فتح اللوحة",
        driverLink: "تتبع السائق",
      },
    };

    let currentLang = localStorage.getItem("app_lang") || "tr";

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N.tr[key] || key;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function applyLanguage() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
      document.getElementById("langSelect").value = currentLang;
      document.getElementById("pageTitle").textContent = t("pageTitle");
      document.getElementById("pageHelp").textContent = t("pageHelp");
      document.getElementById("backLink").textContent = t("backLink");
      document.getElementById("adminLink").textContent = t("adminLink");
      document.getElementById("driverLink").textContent = t("driverLink");
      document.title = t("pageTitle");
    }

    function renderMarkets() {
      document.getElementById("marketGrid").innerHTML = MARKETS.map((market) => `
        <a class="market-card" href="market.html?market=${encodeURIComponent(market.key)}">
          <div class="market-badge" style="background:${escapeHtml(market.color)}">${escapeHtml(market.label.slice(0, 3).toUpperCase())}</div>
          <div class="market-name">${escapeHtml(market.label)}</div>
          <div class="market-link">${escapeHtml(t("openPanel"))} →</div>
        </a>
      `).join("");
    }

    document.getElementById("langSelect").addEventListener("change", (event) => {
      currentLang = String(event.target.value || "tr");
      localStorage.setItem("app_lang", currentLang);
      applyLanguage();
      renderMarkets();
    });

    applyLanguage();
    renderMarkets();
    }
  </script>
</body>
</html>
