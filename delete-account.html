<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete Account - Pazar Fiyatı</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 24px; line-height: 1.6; color: #333; background:#f8fafc; }
    h1 { color: #1a73e8; }
    a { color: #1a73e8; }
    .panel { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:22px; box-shadow:0 12px 30px rgba(15,23,42,.06); }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    button { padding:11px 16px; border:0; border-radius:10px; cursor:pointer; font:inherit; font-weight:700; }
    .danger { background:#dc2626; color:#fff; }
    .secondary { background:#e2e8f0; color:#1e293b; text-decoration:none; padding:11px 16px; border-radius:10px; font-weight:700; }
    textarea { width:100%; min-height:110px; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:10px; padding:11px 12px; font:inherit; resize:vertical; }
    label { display:grid; gap:8px; margin-top:14px; font-weight:700; }
    .status { margin-top:16px; padding:12px 14px; border-radius:10px; background:#eff6ff; color:#1e3a8a; font-weight:700; }
    .status.error { background:#fee2e2; color:#991b1b; }
  </style>
</head>
<body>
  <main class="panel">
    <h1 id="title">Delete Your Account</h1>
    <p id="intro">Press the button below to send a deletion request for the Gmail account saved in your profile.</p>
    <p><strong id="emailLabel">Gmail:</strong> <span id="requestEmail"></span></p>
    <p><strong id="addressLabel">Address:</strong> <span id="requestAddress"></span></p>
    <p id="promiseText">We will send your request to the admin. Your data will be deleted within a maximum of 7 days, and we will send you an email as soon as possible.</p>
    <label>
      <span id="messageLabel">Please tell us the reason</span>
      <textarea id="requestMessage" placeholder="Please tell us why you want to delete your account" required minlength="10"></textarea>
    </label>
    <div class="actions">
      <button id="requestDeleteBtn" class="danger" type="button">Send delete request</button>
      <a id="backLink" class="secondary" href="index.html" data-app-nav="index.html">Back to app</a>
    </div>
    <div id="statusBox" class="status" hidden></div>
  </main>

  <script src="feature-access.js"></script>
  <script src="app-settings.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { initializeFirestore, doc, setDoc, addDoc, collection, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import firebaseConfig from "./firebase-config.js";

    await window.AppSettings.ready();
    if (!window.FeatureAccess?.guardPage()) {
    } else {
      const I18N = {
        tr: {
          title: "Hesabini sil",
          intro: "Profilinde kayitli Gmail hesabi icin silme istegi gondermek uzere asagidaki dugmeye bas.",
          emailLabel: "Gmail:",
          addressLabel: "Adres:",
          noAddress: "Profilde kayitli adres yok",
          promiseText: "Silme istegini admine gonderecegiz. Verilerin en fazla 7 gun icinde silinecek ve islem tamamlaninca sana e-posta gonderecegiz.",
          messageLabel: "Lutfen silme nedeninizi yazin",
          messagePlaceholder: "Hesabinizi neden silmek istediginizi kisa bir sekilde aciklayin",
          requestDeleteBtn: "Silme istegi gonder",
          backLink: "Uygulamaya don",
          missingLogin: "Silme istegi gondermek icin once giris yapmalisin.",
          sending: "Istek gonderiliyor...",
          sent: "Istek admine gonderildi. Islem tamamlaninca sana e-posta gonderecegiz.",
          failed: "Istek gonderilemedi",
          messageRequired: "Lutfen hesabinizi neden silmek istediginizi yazin.",
          reasonTooShort: "Lutfen en az 10 karakterlik bir aciklama yazin."
        },
        en: {
          title: "Delete your account",
          intro: "Press the button below to send a deletion request for the Gmail account saved in your profile.",
          emailLabel: "Gmail:",
          addressLabel: "Address:",
          noAddress: "No address saved in profile",
          promiseText: "We will send your request to the admin. Your data will be deleted within a maximum of 7 days, and we will email you when it is completed.",
          messageLabel: "Please tell us the reason",
          messagePlaceholder: "Please tell us why you want to delete your account",
          requestDeleteBtn: "Send delete request",
          backLink: "Back to app",
          missingLogin: "Please sign in before sending a deletion request.",
          sending: "Sending request...",
          sent: "Your request was sent to the admin. We will email you when your account deletion is completed.",
          failed: "Could not send request",
          messageRequired: "Please tell us why you want to delete your account.",
          reasonTooShort: "Please write at least 10 characters explaining your reason."
        },
        ar: {
          title: "حذف حسابك",
          intro: "اضغط الزر أدناه لإرسال طلب حذف لحساب Gmail المحفوظ في ملفك.",
          emailLabel: "Gmail:",
          addressLabel: "العنوان:",
          noAddress: "لا يوجد عنوان محفوظ في الملف",
          promiseText: "سنرسل طلبك إلى المسؤول. سيتم حذف بياناتك خلال مدة أقصاها 7 أيام، وسنرسل لك بريداً إلكترونياً عند اكتمال العملية.",
          messageLabel: "يرجى إخبارنا بالسبب",
          messagePlaceholder: "يرجى إخبارنا لماذا تريد حذف حسابك",
          requestDeleteBtn: "إرسال طلب الحذف",
          backLink: "العودة إلى التطبيق",
          missingLogin: "يرجى تسجيل الدخول قبل إرسال طلب الحذف.",
          sending: "جار إرسال الطلب...",
          sent: "تم إرسال طلبك إلى المسؤول. سنرسل لك بريداً إلكترونياً عند اكتمال حذف الحساب.",
          failed: "تعذر إرسال الطلب",
          messageRequired: "يرجى إخبارنا لماذا تريد حذف حسابك.",
          reasonTooShort: "يرجى كتابة شرح لا يقل عن 10 أحرف."
        }
      };

      const app = initializeApp(firebaseConfig);
      const db = initializeFirestore(app, {
        experimentalForceLongPolling: true,
        useFetchStreams: false,
      });
      const currentLang = localStorage.getItem("app_lang") || "tr";
      const userUid = localStorage.getItem("user_uid");
      const userEmail = localStorage.getItem("user_email");
      const userName = localStorage.getItem("user_name");

      function t(key) {
        return (I18N[currentLang] && I18N[currentLang][key]) || I18N.tr[key] || key;
      }

      function setStatus(message, isError = false) {
        const box = document.getElementById("statusBox");
        box.hidden = false;
        box.textContent = message;
        box.className = "status" + (isError ? " error" : "");
      }

      function applyLanguage() {
        document.documentElement.lang = currentLang;
        document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
        document.getElementById("title").textContent = t("title");
        document.getElementById("intro").textContent = t("intro");
        document.getElementById("emailLabel").textContent = t("emailLabel");
        document.getElementById("addressLabel").textContent = t("addressLabel");
        document.getElementById("promiseText").textContent = t("promiseText");
        document.getElementById("messageLabel").textContent = t("messageLabel");
        document.getElementById("requestMessage").placeholder = t("messagePlaceholder");
        document.getElementById("requestDeleteBtn").textContent = t("requestDeleteBtn");
        document.getElementById("backLink").textContent = t("backLink");
        document.title = t("title");
      }

      async function resolveUserAddress() {
        const fromStorage = String(localStorage.getItem("user_address") || "").trim();
        if (fromStorage) return fromStorage;
        if (!userUid) return "";
        try {
          const snap = await getDoc(doc(db, "users", userUid));
          if (snap.exists()) {
            const address = String(snap.data().address || "").trim();
            if (address) {
              localStorage.setItem("user_address", address);
              return address;
            }
          }
        } catch (error) {
          console.warn("Could not load profile address", error);
        }
        return "";
      }

      async function sendDeleteRequest() {
        if (!userUid || !userEmail) {
          setStatus(t("missingLogin"), true);
          setTimeout(() => { window.location.href = "login.html"; }, 900);
          return;
        }
        const message = document.getElementById("requestMessage").value.trim();
        if (!message) {
          setStatus(t("messageRequired"), true);
          document.getElementById("requestMessage").focus();
          return;
        }
        if (message.length < 10) {
          setStatus(t("reasonTooShort"), true);
          document.getElementById("requestMessage").focus();
          return;
        }
        setStatus(t("sending"));
        try {
          const requestedAt = new Date().toISOString();
          const userLang = localStorage.getItem("app_lang") || "tr";
          const address = await resolveUserAddress();
          const phone = String(localStorage.getItem("user_phone") || "").trim();
          const inboxRef = await addDoc(collection(db, "adminInbox"), {
            userId: userUid,
            email: userEmail,
            name: userName || "",
            address,
            phone,
            message,
            reason: message,
            status: "pending",
            requestedAt,
            lang: userLang,
            source: "delete-request",
          });
          await setDoc(doc(db, "deleteRequests", userUid), {
            userId: userUid,
            email: userEmail,
            name: userName || "",
            address,
            phone,
            message,
            reason: message,
            status: "pending",
            requestedAt,
            lang: userLang,
            inboxEntryId: inboxRef.id,
            adminOnly: true,
          }, { merge: true });
          document.getElementById("requestDeleteBtn").disabled = true;
          setStatus(t("sent"));
          setTimeout(() => {
            if (window.FeatureAccess?.navigateToAppPage) {
              window.FeatureAccess.navigateToAppPage("index.html");
            } else {
              window.location.href = "index.html";
            }
          }, 1800);
        } catch (error) {
          setStatus(`${t("failed")}: ${error.message}`, true);
        }
      }

      applyLanguage();
      document.getElementById("requestEmail").textContent = userEmail || t("missingLogin");
      resolveUserAddress().then((address) => {
        document.getElementById("requestAddress").textContent = address || t("noAddress");
      });
      document.getElementById("requestDeleteBtn").addEventListener("click", sendDeleteRequest);
    }
  </script>
</body>
</html>
