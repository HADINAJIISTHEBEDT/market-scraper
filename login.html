<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="css.css" />
  <style>
    :root {
      --page-bg: #edf2fb;
      --panel-bg: #ffffff;
      --panel-border: #d7deea;
      --text-main: #202124;
      --text-muted: #5f6368;
      --accent: #1a73e8;
      --button-bg: #ffffff;
      --button-hover: #f7faff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text-main);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .page {
      width: min(980px, calc(100vw - 24px));
      margin: 28px auto 16px;
    }

    .lang-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .lang-select {
      min-width: 112px;
      padding: 8px 10px;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      background: #fff;
      font: inherit;
    }

    .shell {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(30, 41, 59, 0.06);
    }

    .shell-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--panel-border);
      font-size: 15px;
    }

    .app-mark {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #1a73e8;
      flex: 0 0 auto;
    }

    .content {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 32px;
      padding: 34px 36px;
    }

    .hero {
      padding-right: 8px;
    }

    .hero-logo {
      width: 48px;
      height: 48px;
      border: 2px solid #111827;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      margin-bottom: 26px;
    }

    .hero h1 {
      font-size: 54px;
      line-height: 1.02;
      font-weight: 400;
      margin: 0 0 18px;
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      color: var(--text-muted);
    }

    .hero p strong,
    .brand-ltr {
      color: var(--accent);
      font-weight: 500;
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
    }

    html[dir="rtl"] .hero p {
      text-align: right;
    }

    .auth-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 360px;
    }

    .account-box {
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 18px;
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .google-button {
      width: 100%;
      border: 1px solid var(--panel-border);
      background: var(--button-bg);
      color: var(--text-main);
      border-radius: 18px;
      padding: 18px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, border-color 0.15s ease;
      font: inherit;
    }

    .google-button:hover {
      background: var(--button-hover);
      border-color: #c2cbe0;
    }

    .account-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #d93025;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .account-copy {
      min-width: 0;
      flex: 1 1 auto;
    }

    .account-title {
      font-size: 22px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .account-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .status-box {
      min-height: 24px;
      margin: 8px 0 18px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .status-box.error {
      color: #b91c1c;
    }

    .status-box.success {
      color: #166534;
    }

    .success-action {
      display: none;
      margin-top: 10px;
    }

    .success-action.visible {
      display: block;
    }

    .success-link {
      width: 100%;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .owner-password {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid #d8e4df;
      border-radius: 12px;
      background: #f8fbfa;
    }

    .owner-password.visible {
      display: block;
    }

    .owner-password label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #315f4e;
      margin-bottom: 8px;
    }

    .owner-password input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #c6d7d0;
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      margin-bottom: 10px;
    }

    .owner-password button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      background: #1d7a5f;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .meta-copy {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .meta-copy a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer {
      width: min(980px, calc(100vw - 24px));
      margin: 0 auto 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--text-muted);
      font-size: 14px;
      padding: 0 6px;
    }

    .footer-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    @media (max-width: 860px) {
      .content {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 26px 22px;
      }

      .hero h1 {
        font-size: 40px;
      }

      .hero p {
        font-size: 22px;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100vw - 12px, 980px);
        margin-top: 12px;
      }

      .shell {
        border-radius: 20px;
      }

      .shell-top {
        padding: 14px 16px;
      }

      .content {
        padding: 18px 16px 22px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .hero p {
        font-size: 20px;
      }

      .footer {
        width: min(100vw - 12px, 980px);
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="lang-row">
      <select id="langSelect" class="lang-select">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>
    </div>

    <section class="shell">
      <div class="shell-top">
        <span class="app-mark" aria-hidden="true"></span>
        <span id="topLabel">Giris Yap</span>
      </div>

      <div class="content">
        <section class="hero">
          <div class="hero-logo" aria-hidden="true">M</div>
          <h1 id="title">Bir hesap secin</h1>
          <p id="subtitle">Devam etmek icin <strong id="brandName">Pazar Fiyatı</strong></p>
        </section>

        <section class="auth-panel">
          <div>
            <div class="account-box">
              <div class="section-label" id="accountSectionLabel">Gercek Gmail hesabinizi kullanin</div>
              <button id="googleSignInBtn" class="google-button" type="button">
                <span class="account-avatar">G</span>
                <span class="account-copy">

                </span>
              </button>
            </div>

            <div id="authStatus" class="status-box"></div>
            <div id="successAction" class="success-action">
              <button id="goHomeBtn" class="success-link" type="button">Go to home page</button>
            </div>
            <div id="ownerPasswordBox" class="owner-password">
              <label id="ownerPasswordLabel" for="ownerPasswordInput">Enter owner password to proceed</label>
              <input id="ownerPasswordInput" type="password" autocomplete="current-password" />
              <button id="ownerPasswordBtn" type="button">Open owner page</button>
            </div>
          </div>

          <div class="meta-copy">
            <span id="policyText">By continuing, you agree to the app's terms.</span>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a href="index.html" id="backLink" data-app-nav="index.html">&larr; Aramaya don</a>
    <div class="footer-links">
      <a href="privacy-policy.html" id="privacyLink">Privacy Policy</a>
      <a href="delete-account.html" id="deleteAccountLink" class="locked-feature-link">Delete Account</a>
    </div>
  </footer>

  <script src="feature-access.js"></script>

  <script src="firebase-config.global.js"></script>

    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    if (!window.FIREBASE_CONFIG) {
      throw new Error("firebase-config.global.js is missing from this folder.");

    const firebaseConfig = window.FIREBASE_CONFIG;
    function detectAndroidApp() {

    }
    const AUTH_BRIDGE_CANDIDATES = detectAndroidApp()
      ? [
        "https://market-scraper-0k36.onrender.com/auth-bridge.html",
        "https://st-business-86a9b.firebaseapp.com/auth-bridge.html",
        "https://st-business-86a9b.web.app/auth-bridge.html",
      ]

        "https://st-business-86a9b.firebaseapp.com/auth-bridge.html",
        "https://st-business-86a9b.web.app/auth-bridge.html",
        "https://market-scraper-0k36.onrender.com/auth-bridge.html",
      ];
    const isFilePage = location.protocol === "file:";

        errorProfileSave: "The account signed in, but the profile data could not be saved."
      },
      ar: {
        topLabel: "تسجيل الدخول",

        subtitlePrefix: "للمتابعة إلى ",
        brandName: "Pazar Fiyatı",
        accountSectionLabel: "استخدم حساب Gmail الحقيقي الخاص بك",
        buttonTitle: "المتابعة باستخدام Google",
        buttonSubtitle: "ستفتح نافذة اختيار الحساب ثم سيتابع التطبيق تلقائيا بعد تسجيل الدخول.",
        policyText: 'بالمتابعة، فإنك توافق على <a href="privacy-policy.html">سياسة الخصوصية</a>.',
        backLink: "العودة إلى البحث",

        goHomeBtn: "الذهاب إلى الصفحة الرئيسية",

        ownerPasswordBtn: "فتح صفحة المالك",
        ownerPasswordError: "كلمة مرور المالك غير صحيحة.",
        privacyPolicy: "سياسة الخصوصية",
        deleteAccount: "حذف الحساب",
        errorGeneric: "فشل تسجيل الدخول عبر Google.",
        errorUnauthorizedDomain: "اسم النطاق هذا غير مصرح به في Firebase Authentication.",
        errorGoogleOnly: "يرجى استخدام حساب Google حقيقي مرتبط بـ Gmail.",
        errorPopupBlocked: "قام المتصفح بحظر النافذة المنبثقة. اسمح بالنوافذ المنبثقة ثم حاول مرة أخرى.",
        errorOperationNotAllowed: "تسجيل الدخول عبر Google غير مفعل في Firebase.",
        errorNetwork: "يوجد خطأ في الشبكة. تحقق من الاتصال ثم حاول مرة أخرى.",
        errorCancelled: "تم بدء أكثر من محاولة تسجيل دخول. حاول مرة أخرى.",
        blockedAccount: "تم حظرك من قبل المسؤول. إذا كنت تعتقد أن هذا سوء فهم، أرسل بريداً إلكترونياً إلى hadi.naji145@gmail.com.",
        errorProfileLoad: "تم تسجيل الدخول لكن تعذر تحميل بيانات الملف الشخصي.",
        errorProfileSave: "تم تسجيل الدخول لكن تعذر حفظ بيانات الملف الشخصي."
      }
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, {
      experimentalForceLongPolling: true,
      useFetchStreams: false,
    });
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    const OWNER_EMAIL = "hadi.naji145@gmail.com";
    const OWNER_PASSWORD = "1";

    let currentLang = localStorage.getItem("app_lang") || "tr";

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N.tr[key] || key;
    }

    function navigateToAppPage(path) {
      if (window.FeatureAccess?.navigateToAppPage) {
        window.FeatureAccess.navigateToAppPage(path || "index.html");
        return;
      }
      window.location.href = path || "index.html";
    }

    function isAndroidApp() {
      return window.FeatureAccess?.isAndroidApp?.() || false;
    }

    function normalizeGmail(email) {
      const value = String(email || "").trim().toLowerCase();
      const [local, domain] = value.split("@");
      if (domain === "gmail.com" || domain === "googlemail.com") {
        return `${local.replace(/\./g, "")}@gmail.com`;
      }
      return value;
    }

    function isOwnerEmail(email) {
      return normalizeGmail(email) === normalizeGmail(OWNER_EMAIL);
    }

    function isGmailAddress(email) {
      return /@(gmail|googlemail)\.com$/i.test(String(email || ""));
    }

    async function safeSignOut() {
      if (isFilePage) return;
      try {
        await signOut(auth);
      } catch (error) {
        console.warn("Sign out skipped", error);
      }
    }

    function getAuthBridgeTarget() {
      const url = AUTH_BRIDGE_CANDIDATES[0];
      return { url, origin: new URL(url).origin };
    }

    async function resolveAuthBridgeUrl() {
      // file:// cannot fetch https (browser blocks it), but popup sign-in still works
      if (isFilePage) {
        return getAuthBridgeTarget();
      }
      for (const url of AUTH_BRIDGE_CANDIDATES) {
        try {
          const response = await fetch(url, { method: "GET", cache: "no-store" });
          if (response.ok) {
            return { url, origin: new URL(url).origin };
          }
        } catch (error) {
          console.warn("Auth bridge unavailable:", url, error);
        }
      }
      return getAuthBridgeTarget();
    }

    function signInViaHostedBridge(bridgeUrl, bridgeOrigin) {
      return new Promise((resolve, reject) => {
        const popup = window.open(bridgeUrl, "pazarquery-auth", "width=520,height=680");
        if (!popup) {
          reject(Object.assign(new Error("popup blocked"), { code: "auth/popup-blocked" }));
          return;
        }

        let settled = false;
        const timeout = setTimeout(() => {
          if (settled) return;
          settled = true;
          window.removeEventListener("message", onMessage);
          reject(new Error("Sign-in timed out. Close the popup and try again."));
        }, 120000);

        function onMessage(event) {
          if (event.origin !== bridgeOrigin) return;
          if (!event.data || event.data.type !== "pazarquery-auth") return;
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          window.removeEventListener("message", onMessage);
          if (event.data.error) {
            reject(new Error(event.data.error));
            return;
          }
          resolve({
            uid: event.data.uid,
            email: event.data.email,
            displayName: event.data.displayName || "",
            photoURL: event.data.photoURL || "",
          });
        }

        window.addEventListener("message", onMessage);
      });
    }

    function setStatus(messageKey, isError = false) {
      const box = document.getElementById("authStatus");
      box.textContent = t(messageKey);
      box.className = "status-box" + (isError ? " error" : messageKey === "statusSuccess" ? " success" : "");
      const successAction = document.getElementById("successAction");
      if (successAction) {
        successAction.classList.toggle("visible", !isError && messageKey === "statusSuccess");
      }
      const ownerPasswordBox = document.getElementById("ownerPasswordBox");
      if (ownerPasswordBox) {
        ownerPasswordBox.classList.remove("visible");
      }
    }

    function setRawStatus(message, isError = false) {
      const box = document.getElementById("authStatus");
      box.textContent = message;
      box.className = "status-box" + (isError ? " error" : "");
      const successAction = document.getElementById("successAction");
      if (successAction) successAction.classList.remove("visible");
      const ownerPasswordBox = document.getElementById("ownerPasswordBox");
      if (ownerPasswordBox) ownerPasswordBox.classList.remove("visible");
    }

    function withTimeout(promise, ms, message) {
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          setTimeout(() => reject(new Error(message)), ms);
        }),
      ]);
    }

    function applyLanguage() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
      document.getElementById("langSelect").value = currentLang;
      document.getElementById("topLabel").textContent = t("topLabel");
      document.getElementById("title").textContent = t("title");
      document.getElementById("accountSectionLabel").textContent = t("accountSectionLabel");
      document.getElementById("buttonTitle").textContent = t("buttonTitle");
      document.getElementById("buttonSubtitle").textContent = t("buttonSubtitle");
      document.getElementById("policyText").innerHTML = t("policyText").replace(
        /href="privacy-policy\.html"/g,
        'href="' + privacyPolicyHref() + '"'
      );
      document.getElementById("backLink").innerHTML = "&larr; " + t("backLink");
      document.getElementById("subtitle").innerHTML =
        `${t("subtitlePrefix")}<strong id="brandName" class="brand-ltr" dir="ltr">Pazar Fiyatı</strong>`;
      document.getElementById("goHomeBtn").textContent = t("goHomeBtn");
      document.getElementById("ownerPasswordLabel").textContent = t("ownerPasswordLabel");
      document.getElementById("ownerPasswordBtn").textContent = t("ownerPasswordBtn");
      document.getElementById("privacyLink").textContent = t("privacyPolicy");
      document.getElementById("privacyLink").href = privacyPolicyHref();
      document.getElementById("deleteAccountLink").textContent = t("deleteAccount");
      document.title = t("topLabel");
    }

    function isRecoverableRedirectError(error) {
      const code = String(error?.code || "");
      const message = String(error?.message || "");
      return code === "auth/no-auth-event" ||
        message.includes("missing initial state") ||
        message.includes("sessionStorage is inaccessible");
    }

    function getFriendlyError(error) {
      const code = String(error?.code || "");
      if (code === "auth/unauthorized-domain") return t("errorUnauthorizedDomain");
      if (code === "auth/popup-blocked") return t("errorPopupBlocked");
      if (code === "auth/operation-not-allowed") return t("errorOperationNotAllowed");
      if (code === "auth/network-request-failed") return t("errorNetwork");
      if (code === "auth/cancelled-popup-request") return t("errorCancelled");
      if (isRecoverableRedirectError(error)) return t("errorCancelled");
      return `${t("errorGeneric")} (${code || error?.message || "unknown"})`;
    }

    function storeUserLocally(user, profile = {}) {
      localStorage.setItem("user_name", profile.name || user.displayName || user.email || "User");
      localStorage.setItem("user_uid", user.uid);
      localStorage.setItem("user_email", user.email || "");
      localStorage.setItem("user_phone", profile.phone || "");
      localStorage.setItem("user_address", profile.address || "");
      localStorage.setItem("user_role", profile.role || "user");
      if (user.photoURL) {
        localStorage.setItem("user_photo", user.photoURL);
      } else {
        localStorage.removeItem("user_photo");
      }
    }

    function buildAuthBridgeUrl(bridgeUrl) {
      const separator = bridgeUrl.includes("?") ? "&" : "?";
      return bridgeUrl + separator + "return=android&fresh=1&select_account=1&webview=1&t=" + Date.now();
    }

    function clearLoginSuccessUI() {
      document.getElementById("successAction")?.classList.remove("visible");
      const box = document.getElementById("authStatus");
      if (box) {
        box.textContent = "";
        box.className = "status-box";
      }
      document.getElementById("ownerPasswordBox")?.classList.remove("visible");
      sessionStorage.removeItem("login_auth_handled");
    }

    function goToHomePage() {
      sessionStorage.setItem("profile_prompt", "1");
      const uid = localStorage.getItem("user_uid");
      if (uid) {
        sessionStorage.setItem("login_auth_handled", uid);
      }

      if (window.AndroidApp?.navigateToPage) {
        try {
          window.AndroidApp.navigateToPage("index.html");
          return;
        } catch (error) {
          console.warn("Android navigate failed", error);
        }
      }
      if (window.FeatureAccess?.isAndroidApp?.() && window.FeatureAccess?.navigateToAppPage) {
        window.FeatureAccess.navigateToAppPage("index.html");
        return;
      }
      window.location.replace("index.html");
    }

    function privacyPolicyHref() {
      return "privacy-policy.html?lang=" + encodeURIComponent(currentLang || "tr");
    }

    async function syncUserRecord(user) {
      const userRef = doc(db, "users", user.uid);
      const snap = await withTimeout(getDoc(userRef), 8000, "Profile load timed out.");
      const existing = snap.exists() ? snap.data() : {};
      const deviceId = window.FeatureAccess?.getDeviceId?.() || "";
      const sessionId = sessionStorage.getItem("app_session_id") || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      sessionStorage.setItem("app_session_id", sessionId);
      const mergedProfile = {
        ...existing,
        name: existing.name || user.displayName || user.email || "User",
        email: user.email || existing.email || "",
        photoURL: user.photoURL || existing.photoURL || "",
        phone: existing.phone || localStorage.getItem("user_phone") || "",
        address: existing.address || localStorage.getItem("user_address") || "",
        role: isOwnerEmail(user.email || existing.email) ? "admin" : (existing.role || "user"),
        lastDeviceId: deviceId,
        lastSessionId: sessionId,
        lastLoginAt: new Date().toISOString(),
        createdAt: existing.createdAt || new Date().toISOString()
      };
      await withTimeout(setDoc(userRef, mergedProfile, { merge: true }), 8000, "Profile save timed out.");
      if (deviceId) {
        await withTimeout(setDoc(userRef, { deviceIds: arrayUnion(deviceId) }, { merge: true }), 8000, "Device save timed out.");
      }
      try {
        await deleteDoc(doc(db, "deletedAccounts", user.uid));
      } catch (error) {
        console.warn("Could not clear deleted account marker", error);
      }
      sessionStorage.removeItem("admin_delete_logout_handled");
      sessionStorage.removeItem("account_deletion_forced");
      sessionStorage.removeItem("deleted_account_notice");
      return mergedProfile;
    }

    async function routeSignedInUser(user) {
      setStatus("statusChecking");
      try {
        if (!user.email || !isGmailAddress(user.email)) {
          await safeSignOut();
          setRawStatus(t("errorGoogleOnly"), true);
          return;
        }

        storeUserLocally(user, {
          name: user.displayName || user.email || "User",
          phone: localStorage.getItem("user_phone") || "",
          address: localStorage.getItem("user_address") || ""
        });
        sessionStorage.removeItem("force_account_picker");

        let profileWarning = "";
        try {
          const profile = await syncUserRecord(user);
          if (profile.blocked) {
            await safeSignOut();
            window.FeatureAccess?.clearLocalUser?.();
            setRawStatus(window.FeatureAccess?.t?.("blockedAccountBody") || t("blockedAccount"), true);
            return;
          }
          storeUserLocally(user, profile);
        } catch (error) {
          console.error("Profile sync failed", error);
          profileWarning = ` ${t("errorProfileSave")} (${error.message || "unknown"})`;
        }

        setStatus("statusSuccess");
        if (profileWarning) {
          document.getElementById("authStatus").textContent += profileWarning;
        }
        if (isOwnerEmail(user.email)) {
          showOwnerPassword();
          return;
        }
      } catch (error) {
        console.error("Login routing failed", error);
        const messageKey = String(error?.code || "").startsWith("permission-")
          ? "errorProfileSave"
          : "errorProfileLoad";
        setRawStatus(`${t(messageKey)} (${String(error?.code || error?.message || "unknown")})`, true);
      }
    }

    function showOwnerPassword() {
      document.getElementById("successAction").classList.remove("visible");
      document.getElementById("ownerPasswordBox").classList.add("visible");
      document.getElementById("ownerPasswordInput").focus();
    }

    async function unlockOwnerPage() {
      const passwordInput = document.getElementById("ownerPasswordInput");
      if (passwordInput.value !== OWNER_PASSWORD) {
        setRawStatus(t("ownerPasswordError"), true);
        showOwnerPassword();
        return;
      }

      const uid = localStorage.getItem("user_uid");
      const email = localStorage.getItem("user_email");
      if (!uid || !isOwnerEmail(email)) {
        setRawStatus(t("errorGoogleOnly"), true);
        return;
      }

      localStorage.setItem("owner_access", "true");
      localStorage.setItem("owner_email", normalizeGmail(OWNER_EMAIL));
      localStorage.setItem("user_role", "admin");
      try {
        await withTimeout(setDoc(doc(db, "users", uid), {
          role: "admin",
          ownerAccessAt: new Date().toISOString()
        }, { merge: true }), 8000, "Owner role save timed out.");
      } catch (error) {
        console.error("Owner role save failed", error);
      }
      if (isAndroidApp()) {
        navigateToAppPage("admin.html");
        return;
      }
      window.location.href = "admin.html";
    }

    function handleAndroidAuthReturn() {
      const params = new URLSearchParams(window.location.search);
      const uid = params.get("auth_uid");
      const email = params.get("auth_email");
      if (!uid || !email) return false;
      history.replaceState({}, "", "login.html");
      void routeSignedInUser({
        uid,
        email,
        displayName: params.get("auth_name") || "",
        photoURL: params.get("auth_photo") || "",
      });
      return true;
    }

    async function continueWithGoogle() {
      setStatus("statusStarting");
      sessionStorage.removeItem("login_auth_handled");
      sessionStorage.removeItem("android_auto_signin_tried");
      sessionStorage.setItem("force_account_picker", "1");
      await safeSignOut();
      if (window.AndroidApp?.clearAuthSession) {
        window.AndroidApp.clearAuthSession();
      }
      if (isFilePage) {
        try {
          const bridge = await resolveAuthBridgeUrl();
          const user = await signInViaHostedBridge(bridge.url, bridge.origin);
          await routeSignedInUser(user);
        } catch (error) {
          console.error("Google sign-in failed", error);
          setRawStatus(error.message || getFriendlyError(error), true);
        }
        return;
      }

      if (isAndroidApp()) {
        try {
          const bridge = await resolveAuthBridgeUrl();
          const authUrl = buildAuthBridgeUrl(bridge.url);
          if (window.AndroidApp?.openExternalAuth) {
            window.AndroidApp.openExternalAuth(authUrl);
            setRawStatus(t("statusStarting"));
            return;
          }
          await setPersistence(auth, browserLocalPersistence);
          navigateToAppPage("auth-bridge.html?from=app");
          return;
        } catch (error) {
          console.error("Google sign-in failed", error);
          setRawStatus(getFriendlyError(error), true);
          return;
        }
      }

      try {
        await setPersistence(auth, browserLocalPersistence);
        try {
          const result = await signInWithPopup(auth, provider);
          if (result?.user) {
            await routeSignedInUser(result.user);
          }
        } catch (popupError) {
          const code = String(popupError?.code || "");
          if (code === "auth/popup-blocked" || code === "auth/cancelled-popup-request") {
            await signInWithRedirect(auth, provider);
            return;
          }
          throw popupError;
        }
      } catch (error) {
        console.error("Google sign-in failed", error);
        setRawStatus(getFriendlyError(error), true);
      }
    }

    async function handleExistingSession() {
      if (isFilePage) return;
      await setPersistence(auth, browserLocalPersistence);

      if (sessionStorage.getItem("force_account_picker") === "1") {
        clearLoginSuccessUI();
        await safeSignOut();
        if (window.AndroidApp?.clearAuthSession) {
          window.AndroidApp.clearAuthSession();
        }
        return;
      }

      const localUid = localStorage.getItem("user_uid");
      const localEmail = localStorage.getItem("user_email");
      if (!localUid || !localEmail) {
        clearLoginSuccessUI();
        try {
          await signOut(auth);
        } catch (error) {
          console.warn("Sign out skipped", error);
        }
        return;
      }

      if (!isAndroidApp()) {
        try {
          const result = await getRedirectResult(auth);
          if (result?.user) {
            sessionStorage.setItem("login_auth_handled", result.user.uid);
            await routeSignedInUser(result.user);
            return;
          }
        } catch (error) {
          if (!isRecoverableRedirectError(error)) {
            console.error("Google redirect sign-in failed", error);
            setRawStatus(getFriendlyError(error), true);
            return;
          }
          console.warn("Redirect result unavailable, checking existing session", error);
        }
      }

      onAuthStateChanged(auth, async (user) => {
        if (!user) return;
        if (user.uid !== localUid) return;
        const handledUid = sessionStorage.getItem("login_auth_handled");
        if (handledUid === user.uid) {
          await routeSignedInUser(user);
          return;
        }
        sessionStorage.setItem("login_auth_handled", user.uid);
        await routeSignedInUser(user);
      });
    }

    document.getElementById("langSelect").addEventListener("change", (event) => {
      currentLang = String(event.target.value || "tr");
      localStorage.setItem("app_lang", currentLang);
      applyLanguage();
    });

    document.getElementById("googleSignInBtn").addEventListener("click", continueWithGoogle);
    document.getElementById("goHomeBtn").addEventListener("click", goToHomePage);
    document.getElementById("ownerPasswordBtn").addEventListener("click", unlockOwnerPage);
    document.getElementById("ownerPasswordInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") unlockOwnerPage();
    });

    applyLanguage();
    window.FeatureAccess?.showBlockedAccountNotice?.();
    await window.AppSettings.ready();
    window.FeatureAccess?.initLoginNotice?.();
    if (!handleAndroidAuthReturn()) {
      handleExistingSession();
    }
    window.FeatureAccess?.initLockedFooterLinks?.();
  </script>
</body>
</html>
